<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>PolyDict is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f6f8f6; color: #181d1a; }
      main { max-width: 420px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: #059669; color: #fff; font-size: 28px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
      p { margin: 12px 0 24px; color: #59615c; line-height: 1.6; }
      button { min-height: 46px; padding: 0 18px; border: 0; border-radius: 14px; background: #047857; color: #fff; font: inherit; font-weight: 650; }
      @media (prefers-color-scheme: dark) { body { background: #101412; color: #edf2ee; } p { color: #aab3ad; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>You’re offline</h1>
      <p>PolyDict’s saved words and app shell are available. Reconnect to search online dictionaries and get Gemini explanations.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
